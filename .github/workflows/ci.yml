name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGURL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout the immutable BTW truth baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ykorets/btw
          ref: ee25bc75da58f167c54055ee1514caabc7c4287f
          path: _deps/btw
      - name: Wait for the final PostGIS server
        run: |
          for attempt in {1..30}; do
            if psql "$PGURL" -v ON_ERROR_STOP=1 -c \
              'select postgis_version()' >/dev/null 2>&1; then
              sleep 1
              if psql "$PGURL" -v ON_ERROR_STOP=1 -c \
                'select postgis_version()' >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "final PostGIS server did not become stable" >&2
          exit 1
      - name: Apply the BTW shared schema
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f _deps/btw/engine/schema/001_init.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -c \
            'create role anon; create role authenticated; create role service_role bypassrls;
             create schema extensions;
             alter extension "uuid-ossp" set schema extensions;
             alter database postgres set search_path to public, extensions;'
          for file in _deps/btw/engine/schema/00{2..8}_*.sql; do
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Apply the Compute Record domain migration
        run: >-
          psql "$PGURL" -v ON_ERROR_STOP=1
          -f supabase/migrations/20260714180000_compute_domain.sql
      - name: Run Compute Record SQL regression scenarios
        run: >-
          psql "$PGURL" -v ON_ERROR_STOP=1
          -f schema/regression/001_compute_domain_regression.sql
      - name: Prove the external baseline cannot be faked
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'create database external_baseline_guard'
          guard_url="${PGURL%/*}/external_baseline_guard"
          if psql "$guard_url" -v ON_ERROR_STOP=1 -f supabase/migrations/20260711012826_init_engine_schema_v2.sql >external-baseline-guard.txt 2>&1; then
            echo "external baseline guard unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F 'missing external BTW migration 20260711012826' external-baseline-guard.txt

  btw-mirror-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the immutable BTW truth baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ykorets/btw
          ref: ee25bc75da58f167c54055ee1514caabc7c4287f
          path: _deps/btw
      - name: Checkout the current generated BTW mirror
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ykorets/btw
          ref: mirror
          path: _deps/btw-mirror
      - name: Verify BTW public mirror v1 compatibility
        run: >-
          PYTHONPATH=_deps/btw/engine/src python
          -m btw_engine.compat --data _deps/btw-mirror/data

  deployment-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify the reviewed migration artifact
        run: sha256sum --check deploy/manifests/001_compute_domain.sha256
      - name: Validate the deployment manifest
        run: |
          actual_sha="$(cut -d ' ' -f 1 deploy/manifests/001_compute_domain.sha256)"
          manifest_sha="$(jq -r '.migration.sha256' deploy/manifests/001_compute_domain.json)"
          test "$actual_sha" = "$manifest_sha"
          jq -e '
            .target_project_ref == "txglwhwnmjtbijbgcpwd"
            and .migration.version == "20260714180000"
            and (.external_baseline | length) == 9
          ' deploy/manifests/001_compute_domain.json >/dev/null

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Checkout the pinned BTW public mirror
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ykorets/btw
          ref: d5ccb766ad6630784b9de38837948f87e692d94e
          path: _deps/btw-mirror
      - name: Run benchmark unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s engine/tests -v
      - name: Verify the sealed primary-source registry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.sources.registry verify
          --registry sources/registry.json
          --expected-sources 10
      - name: Verify the deterministic watcher schedule
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.sources.schedule verify
          --registry sources/registry.json
          --schedule sources/schedule.json
      - name: Rebuild the watcher schedule
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.sources.schedule build
          --registry sources/registry.json
          --output /tmp/rebuilt-watcher-schedule.json
      - name: Prove deterministic watcher scheduling
        run: cmp sources/schedule.json /tmp/rebuilt-watcher-schedule.json
      - name: Verify the bootstrap source observations
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.sources.health verify-observations
          --registry sources/registry.json
          --observations sources/observations/2026-07-25T225144Z.json
          --require-all-successful
      - name: Verify the bootstrap source health report
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.sources.health verify-health
          --registry sources/registry.json
          --schedule sources/schedule.json
          --observations sources/observations/2026-07-25T225144Z.json
          --health sources/health/2026-07-25T225144Z.json
          --as-of 2026-07-25T22:51:44Z
      - name: Verify the SEC submissions adapter fixture
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.sources.sec_submissions verify
          --registry sources/registry.json
          --source-id sec-submissions:cik-0001144879
          --response sources/fixtures/sec-submissions-applied-digital.json
          --discovered-at 2026-07-25T23:00:00Z
          --after-accession 0001493152-26-028993
          --candidates
          sources/fixtures/sec-submissions-applied-digital-candidates.json
      - name: Rebuild the SEC filing candidate fixture
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.sources.sec_submissions build
          --registry sources/registry.json
          --source-id sec-submissions:cik-0001144879
          --response sources/fixtures/sec-submissions-applied-digital.json
          --discovered-at 2026-07-25T23:00:00Z
          --after-accession 0001493152-26-028993
          --output /tmp/rebuilt-sec-candidates.json
      - name: Prove deterministic SEC candidate discovery
        run: >-
          cmp sources/fixtures/sec-submissions-applied-digital-candidates.json
          /tmp/rebuilt-sec-candidates.json
      - name: Verify the sealed 50-target benchmark
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.benchmarks.neocloud verify
          --artifact-dir benchmarks/neocloud-buildout-registry/2026-07-14
          --expected-count 50
      - name: Rebuild resolution from the pinned BTW mirror
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.benchmarks.neocloud resolve
          --targets benchmarks/neocloud-buildout-registry/2026-07-14/targets.json
          --facilities _deps/btw-mirror/data/facilities.json
          --announcements _deps/btw-mirror/data/announcements.json
          --btw-mirror-commit d5ccb766ad6630784b9de38837948f87e692d94e
          --output-dir /tmp/rebuilt-benchmark
      - name: Prove deterministic resolution and gap reporting
        run: |
          cmp benchmarks/neocloud-buildout-registry/2026-07-14/resolution.json \
            /tmp/rebuilt-benchmark/resolution.json
          cmp benchmarks/neocloud-buildout-registry/2026-07-14/gap-report.json \
            /tmp/rebuilt-benchmark/gap-report.json
      - name: Verify the sealed primary-source intake queue
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.intake verify
          --artifact-dir research/m3/primary-source-intake
          --targets benchmarks/neocloud-buildout-registry/2026-07-14/targets.json
          --resolution benchmarks/neocloud-buildout-registry/2026-07-14/resolution.json
          --expected-tasks 49
      - name: Rebuild the primary-source intake queue
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.intake build
          --targets benchmarks/neocloud-buildout-registry/2026-07-14/targets.json
          --resolution benchmarks/neocloud-buildout-registry/2026-07-14/resolution.json
          --output-dir /tmp/rebuilt-intake
      - name: Prove deterministic primary-source intake
        run: |
          cmp research/m3/primary-source-intake/queue.json \
            /tmp/rebuilt-intake/queue.json
          cmp research/m3/primary-source-intake/report.json \
            /tmp/rebuilt-intake/report.json
      - name: Verify the first private evidence capture batch
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.archive.capture verify-batch
          --root .
          --manifest research/m3/evidence-captures/2026-07-25/manifest.json
          --expected-receipts 1
      - name: Rebuild the evidence capture batch manifest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.archive.capture build-batch
          --root .
          --queue research/m3/primary-source-intake/queue.json
          --receipt
          research/m3/evidence-captures/2026-07-25/childress-sec-10q/receipt.json
          --output /tmp/rebuilt-capture-manifest.json
      - name: Prove deterministic evidence capture lineage
        run: >-
          cmp research/m3/evidence-captures/2026-07-25/manifest.json
          /tmp/rebuilt-capture-manifest.json
      - name: Verify the Delta Forge private evidence capture
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.archive.capture verify-batch
          --root .
          --manifest
          research/m3/evidence-captures/2026-07-25/manifest-02.json
          --expected-receipts 1
      - name: Rebuild the Delta Forge capture manifest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.archive.capture build-batch
          --root .
          --queue research/m3/primary-source-intake/queue.json
          --receipt
          research/m3/evidence-captures/2026-07-25/delta-forge-1-sec-8k/receipt.json
          --output /tmp/rebuilt-delta-forge-capture-manifest.json
      - name: Prove deterministic Delta Forge capture lineage
        run: >-
          cmp research/m3/evidence-captures/2026-07-25/manifest-02.json
          /tmp/rebuilt-delta-forge-capture-manifest.json
      - name: Verify the Beacon Point private evidence capture
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.archive.capture verify-batch
          --root .
          --manifest
          research/m3/evidence-captures/2026-07-25/manifest-03.json
          --expected-receipts 1
      - name: Rebuild the Beacon Point capture manifest
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.archive.capture build-batch
          --root .
          --queue research/m3/primary-source-intake/queue.json
          --receipt
          research/m3/evidence-captures/2026-07-25/beacon-point-sec-8k/receipt.json
          --output /tmp/rebuilt-beacon-point-capture-manifest.json
      - name: Prove deterministic Beacon Point capture lineage
        run: >-
          cmp research/m3/evidence-captures/2026-07-25/manifest-03.json
          /tmp/rebuilt-beacon-point-capture-manifest.json
      - name: Verify the Childress anchored-claim review packet
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.claims verify
          --packet-dir research/m3/claim-reviews/childress-sec-10q
          --spec research/m3/claim-reviews/childress-sec-10q/spec.json
          --receipt
          research/m3/evidence-captures/2026-07-25/childress-sec-10q/receipt.json
      - name: Verify the Childress immutable review decision
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.decision verify
          --spec
          research/m3/claim-reviews/childress-sec-10q/decision-spec.json
          --review-manifest
          research/m3/claim-reviews/childress-sec-10q/review-manifest.json
          --entity-seeds
          research/m3/claim-reviews/childress-sec-10q/entity-seeds.json
          --decision
          research/m3/claim-reviews/childress-sec-10q/review-decision.json
      - name: Verify the Delta Forge anchored-claim review packet
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.claims verify
          --packet-dir research/m3/claim-reviews/delta-forge-1-sec-8k
          --spec research/m3/claim-reviews/delta-forge-1-sec-8k/spec.json
          --receipt
          research/m3/evidence-captures/2026-07-25/delta-forge-1-sec-8k/receipt.json
      - name: Verify the Delta Forge immutable review decision
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.decision verify
          --spec
          research/m3/claim-reviews/delta-forge-1-sec-8k/decision-spec.json
          --review-manifest
          research/m3/claim-reviews/delta-forge-1-sec-8k/review-manifest.json
          --entity-seeds
          research/m3/claim-reviews/delta-forge-1-sec-8k/entity-seeds.json
          --decision
          research/m3/claim-reviews/delta-forge-1-sec-8k/review-decision.json
      - name: Verify the Beacon Point anchored-claim review packet
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.claims verify
          --packet-dir research/m3/claim-reviews/beacon-point-sec-8k
          --spec research/m3/claim-reviews/beacon-point-sec-8k/spec.json
          --receipt
          research/m3/evidence-captures/2026-07-25/beacon-point-sec-8k/receipt.json
      - name: Verify the generated M3 research progress
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.progress verify
          --root .
          --queue research/m3/primary-source-intake/queue.json
          --capture-manifest
          research/m3/evidence-captures/2026-07-25/manifest.json
          --capture-manifest
          research/m3/evidence-captures/2026-07-25/manifest-02.json
          --capture-manifest
          research/m3/evidence-captures/2026-07-25/manifest-03.json
          --review-packet
          research/m3/claim-reviews/childress-sec-10q
          --review-packet
          research/m3/claim-reviews/delta-forge-1-sec-8k
          --as-of 2026-07-25T23:11:45Z
          --progress research/m3/progress.json
      - name: Rebuild M3 research progress
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m engine.research.progress build
          --root .
          --queue research/m3/primary-source-intake/queue.json
          --capture-manifest
          research/m3/evidence-captures/2026-07-25/manifest.json
          --capture-manifest
          research/m3/evidence-captures/2026-07-25/manifest-02.json
          --capture-manifest
          research/m3/evidence-captures/2026-07-25/manifest-03.json
          --review-packet
          research/m3/claim-reviews/childress-sec-10q
          --review-packet
          research/m3/claim-reviews/delta-forge-1-sec-8k
          --as-of 2026-07-25T23:11:45Z
          --output /tmp/rebuilt-research-progress.json
      - name: Prove deterministic M3 progress
        run: cmp research/m3/progress.json /tmp/rebuilt-research-progress.json
